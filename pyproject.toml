[project]
name = "qqbot"
version = "0.1.0"
description = "qqbot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    # NoneBot
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",

    # NoneBot plugins
    "nonebot-plugin-status>=0.9.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-alconna<1.0.0,>=0.56.2",

    # htmlrender
    # 0.5.1 is required by ddcheck's html_to_pic API and has been
    # verified to work with the current Bilibili plugin.
    "nonebot-plugin-htmlrender==0.5.1",

    # Bilibili plugin runtime dependencies
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0,<1.0.0",
    "Jinja2>=3.0,<4.0",
    "qrcode>=7.4",
    "pillow>=11.1.0",
    "pydantic>=2.0",
    "playwright>=1.40",
    "python-multipart>=0.0.9",
    "regex>=2024.5.15",
    "msgpack>=1.0",

    # jmdownloader plugin dependencies
    "aiorwlock>=1.5.1,<2.0.0",
    "nonebot-plugin-uninfo>=0.7.0,<1.0.0",
    "nonebot-plugin-waiter>=0.8.1,<1.0.0",
    "jmcomic>=2.6.13",
    "img2pdf>=0.6.0",
    "pikepdf>=10.3.0",
    "msgspec>=0.19.0",
    "boltons>=24.0.0",
    "cachetools>=5.5.0",
    "pyzipper>=0.3.6",
]


[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-status = ["nonebot_plugin_status"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]

[dependency-groups]
dev = [
    "nb-cli>=1.7.4",
]
